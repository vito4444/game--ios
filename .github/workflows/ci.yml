name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "stable"

jobs:
  godot:
    name: Import check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot
        run: tools/get_godot.sh

      - name: Import project
        run: tools/check_import.sh

      - name: Run unit tests
        run: tools/run_tests.sh

      - name: Upload import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log
          path: .tools/import.log
          if-no-files-found: warn
