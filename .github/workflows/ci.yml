name: CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_RELEASE: "stable"

jobs:
  art:
    name: Generated art and audio are reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Committed art matches the generator
        run: python3 tools/gen_art.py --check

      - name: Committed audio matches the generator
        run: python3 tools/gen_audio.py --check

  godot:
    name: Import check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot
        run: tools/get_godot.sh

      - name: Import project
        run: tools/check_import.sh

      - name: Compile every script and scene
        run: .tools/godot --headless --path . -s tools/compile_all.gd

      - name: Run tests
        run: tools/run_tests.sh

      - name: Upload import log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-log
          path: .tools/import.log
          if-no-files-found: warn

  exports:
    name: Exports and packaged self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot toolchain
        uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Cache export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download Godot and export templates
        run: tools/get_godot.sh --templates

      - name: Import project
        run: tools/check_import.sh

      - name: Export for the browser
        run: tools/export_web.sh

      - name: Export for Linux and run the packaged build's self-test
        # The suite runs against the source tree, where every file exists by
        # definition. This runs inside the exported game, so it sees what the
        # export filter actually packed.
        run: tools/verify_export.sh

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
